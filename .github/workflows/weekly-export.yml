name: Weekly Destiny 2 Data Export

on:
  # Run every Sunday at midnight UTC
  schedule:
    - cron: '0 0 * * 0'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Bungie manifest components
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache
          key: bungie-manifest-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bungie-manifest-${{ runner.os }}-

      - name: Export Destiny 2 build crafting data
        env:
          BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          EXPORT_ARGS: "./destiny-data --excel --excel-master"
        run: |
          if [ -n "$GOOGLE_SHEETS_CREDENTIALS" ]; then
            echo "Google Sheets credentials found, exporting to Google Sheets..."
            node src/exportData.js $EXPORT_ARGS --google-sheets
          else
            echo "No Google Sheets credentials, exporting to JSON, CSV, and Excel only..."
            node src/exportData.js $EXPORT_ARGS
          fi

      - name: Upload data as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: destiny2-build-data-${{ github.run_number }}
          path: destiny-data/
          retention-days: 90

      - name: Compute release date tag
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: date
        run: echo "tag=data-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Publish compendium workbook to a GitHub Release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.date.outputs.tag }}
        run: |
          if [ ! -f destiny-data/destiny2-buildcraft-compendium.xlsx ]; then
            echo "Compendium workbook not found, skipping release."
            exit 0
          fi
          gh release create "$TAG" \
            --title "Destiny 2 Buildcraft Data $TAG" \
            --notes "Automated weekly export of the Destiny 2 Buildcraft Compendium workbook." \
            destiny-data/destiny2-buildcraft-compendium.xlsx || \
          gh release upload "$TAG" destiny-data/destiny2-buildcraft-compendium.xlsx --clobber
